<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO list</title>
</head>
<body>
    <h1>My To-dos</h1>
    <div id="inputTodoCont">
        <label for="inputTodo">Anything new? add it here 👇</label><br>
        <input type="text" name="inputTodo" id="inputTodo" placeholder="Type something new...">
        <button type="button" id="AddBtn">Add</button>
    </div>
    <div>
        <h2>TO-DO List</h2>
        <ul id="todoList">
            <h3>Nothing new!</h3>
        </ul>
        <button type="button" id="ClearBtn">Remove completed tasks</button>
        <button type="button" id="ClearAllBtn">Remove all tasks</button>
    </div>

    <script src="logic.js"></script>
</body>
</html>
